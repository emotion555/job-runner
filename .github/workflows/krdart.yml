name: KR DART filings

on:
  schedule:
    - cron: '*/20 22-23 * * 0-4'
    - cron: '*/20 0-11 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠치를 받을지 (기본 1, 처음에는 7 권장, stocks 입력 시 종목표만)'
        default: '1'

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emotion555/stockradar
          token: ${{ secrets.SR_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: packages
        run: pip install requests pycryptodome
      - name: config.py
        run: |
          cat > crawler/config.py << 'PYEOF'
          DB = {'host': '', 'user': '', 'password': '', 'database': '', 'charset': 'utf8mb4', 'port': 3306}
          CLAUDE_API_KEY = ''
          REDDIT = {'client_id': '', 'client_secret': '', 'user_agent': 'StockRadar/1.0'}
          MAX_STOCKS = 500
          PYEOF
      - name: DART filings
        working-directory: crawler
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: python -u run.py j6 "${DAYS:-1}"
