name: KR fund

on:
  schedule:
    - cron: '0 14 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '비워두면 전 종목(20~30분), test 입력 시 20개만 시험'
        default: ''

permissions:
  contents: read

jobs:
  fund:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emotion555/stockradar
          token: ${{ secrets.SR_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: packages
        run: pip install requests pycryptodome
      - name: config.py
        run: |
          cat > crawler/config.py << 'PYEOF'
          DB = {'host': '', 'user': '', 'password': '', 'database': '', 'charset': 'utf8mb4', 'port': 3306}
          CLAUDE_API_KEY = ''
          REDDIT = {'client_id': '', 'client_secret': '', 'user_agent': 'StockRadar/1.0'}
          MAX_STOCKS = 500
          PYEOF
      - name: KR fund
        working-directory: crawler
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: python -u run.py j8 "${MODE}"
