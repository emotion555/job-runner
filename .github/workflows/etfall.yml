name: ETF all
on:
  schedule:
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'empty = all, test = 150 ETFs only'
        default: ''

concurrency:
  group: etfall
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emotion555/stockradar
          token: ${{ secrets.SR_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: packages
        run: pip install requests pycryptodome yfinance pandas numpy
      - name: config.py
        run: |
          cat > crawler/config.py << 'PYEOF'
          DB = {'host': '', 'user': '', 'password': '', 'database': '', 'charset': 'utf8mb4', 'port': 3306}
          CLAUDE_API_KEY = ''
          REDDIT = {'client_id': '', 'client_secret': '', 'user_agent': 'StockRadar/1.0'}
          MAX_STOCKS = 500
          PYEOF
      - name: Collect
        working-directory: crawler
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: python -u run.py j3 "${MODE}"
