name: keepalive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ka:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git commit --allow-empty -m keepalive
          git push
