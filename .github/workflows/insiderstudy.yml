name: Insider study
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test or empty"
        required: false
        default: ""
concurrency:
  group: insiderstudy
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emotion555/stockradar
          token: ${{ secrets.SR_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yfinance pandas numpy
      - name: Collect
        working-directory: crawler
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: python -u run.py j4 "$MODE"
