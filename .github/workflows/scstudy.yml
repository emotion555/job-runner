name: SC study

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: '비워두면 전 종목(수 시간), test 입력 시 한국 40 + 미국 40종목만 시험'
        default: ''

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emotion555/stockradar
          token: ${{ secrets.SR_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: packages
        run: pip install requests pycryptodome yfinance pandas numpy
      - name: config.py
        run: |
          cat > crawler/config.py << 'PYEOF'
          DB = {'host': '', 'user': '', 'password': '', 'database': '', 'charset': 'utf8mb4', 'port': 3306}
          CLAUDE_API_KEY = ''
          REDDIT = {'client_id': '', 'client_secret': '', 'user_agent': 'StockRadar/1.0'}
          MAX_STOCKS = 500
          PYEOF
      - name: Study
        working-directory: crawler
        env:
          MODE: ${{ github.event.inputs.mode }}
          MAX_MIN: '320'
        run: python -u run.py j19 "${MODE}"
